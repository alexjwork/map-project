<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 dark:from-gray-800 dark:to-gray-900 min-h-screen transition-colors duration-300">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-80 bg-white dark:bg-gray-800 p-6 shadow-xl transform transition-transform duration-300 translate-x-0 hover:shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Map Dashboard</h2>
                <button id="darkModeToggle" class="text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </button>
            </div>
            {% if role %}
            <div class="mb-6 flex space-x-2">
                <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition duration-200">Logout</button>
                {% if role == 'admin' %}
                <a href="{{ url_for('admin') }}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-200">Admin</a>
                {% endif %}
            </div>
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200">Add Landmark</h3>
                <input id="landmarkName" type="text" placeholder="Landmark Name" class="w-full p-2 mb-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white">
                <textarea id="landmarkDesc" placeholder="Description" class="w-full p-2 mb-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white"></textarea>
                <button id="addLandmark" class="bg-green-600 text-white w-full py-2 rounded-lg hover:bg-green-700 transition duration-200">Add Landmark</button>
            </div>
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200">Add Route</h3>
                <input id="routeName" type="text" placeholder="Route Name" class="w-full p-2 mb-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white">
                <button id="startRoute" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition duration-200">Start Route</button>
                <button id="saveRoute" class="bg-green-600 text-white w-full py-2 rounded-lg hover:bg-green-700 transition duration-200 hidden">Save Route</button>
            </div>
            <div>
                <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200">Search Landmarks</h3>
                <input id="searchInput" type="text" placeholder="Search landmarks..." class="w-full p-2 mb-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white">
            </div>
            {% else %}
            <a href="{{ url_for('login') }}" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition duration-200 text-center block">Login</a>
            {% endif %}
        </div>
        <!-- Map -->
        <div id="map" class="w-full relative">
            <div class="absolute top-4 right-4 bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg z-[1000] transform transition-transform duration-300 hover:scale-105">
                <h3 class="text-lg font-semibold text-gray-800 dark:text-white">Landmarks</h3>
                <div id="landmarkList" class="mt-2 max-h-64 overflow-y-auto"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
