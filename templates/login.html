<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 dark:from-gray-800 dark:to-gray-900 min-h-screen flex items-center justify-center transition-colors duration-300">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-96 transform transition-transform duration-300 hover:scale-105">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800 dark:text-white">Login</h2>
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
                <input type="email" id="email" name="email" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
                <input type="password" id="password" name="password" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white" required>
            </div>
            {% if error %}
            <p class="text-red-500 text-sm mb-4">{{ error }}</p>
            {% endif %}
            <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition duration-200">Login</button>
        </form>
        <p class="mt-4 text-center text-gray-600 dark:text-gray-300">Don't have an account? <a href="#" id="showRegister" class="text-blue-600 hover:underline">Register</a></p>
        <form id="registerForm" class="hidden mt-4">
            <div class="mb-4">
                <label for="regEmail" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
                <input type="email" id="regEmail" name="email" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white" required>
            </div>
            <div class="mb-4">
                <label for="regPassword" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
                <input type="password" id="regPassword" name="password" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white" required>
            </div>
            <button type="submit" class="bg-green-600 text-white w-full py-2 rounded-lg hover:bg-green-700 transition duration-200">Register</button>
        </form>
    </div>
</body>
</html>
