<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 dark:from-gray-800 dark:to-gray-900 min-h-screen p-8 transition-colors duration-300">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-6 text-gray-800 dark:text-white">Admin Dashboard</h1>
        <a href="{{ url_for('index') }}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-200 inline-block mb-6">Back to Map</a>
        <h2 class="text-2xl font-semibold mb-4 text-gray-700 dark:text-gray-200">Users</h2>
        <div class="bg-white dark:bg-gray-800 shadow-xl rounded-lg overflow-hidden">
            <table class="w-full">
                <thead>
                    <tr class="bg-gray-200 dark:bg-gray-700">
                        <th class="p-4 text-left text-gray-700 dark:text-gray-200">Email</th>
                        <th class="p-4 text-left text-gray-700 dark:text-gray-200">Role</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition duration-200">
                        <td class="p-4 text-gray-800 dark:text-white">{{ user.email }}</td>
                        <td class="p-4 text-gray-800 dark:text-white">{{ 'Admin' if user.email in ['shrihari@example.com', 'alexjmathew@example.com'] else 'User' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
